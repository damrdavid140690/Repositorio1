<!DOCTYPE html>
<html lang="es">

<meta charset="UTF-8">

<style>
:root{--bg:#0c0c0d;--panel:#18181b;--panel2:#222226;--text:#f7f7f7;--muted:#b9b9bf;--gold:#e0ad25;--gold2:#f3d77d;--line:#303036;--green:#25d366;--red:#ff6b6b}
*{box-sizing:border-box}html{scroll-behavior:smooth}
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:radial-gradient(circle at top right,rgba(224,173,37,.14),transparent 30%),var(--bg);color:var(--text);min-height:100vh}
header{padding:34px 18px 25px;text-align:center;border-bottom:1px solid var(--line)}h1{margin:0;font-size:clamp(2rem,8vw,3.5rem)}.sub{color:var(--muted);margin:8px 0 0}
.status{display:inline-flex;align-items:center;gap:8px;margin-top:15px;padding:7px 11px;border:1px solid var(--line);border-radius:999px;color:var(--muted);font-size:.86rem;background:#ffffff08}
.dot{width:9px;height:9px;border-radius:50%;background:var(--gold)}.dot.ok{background:var(--green)}.dot.error{background:var(--red)}
.wrap{width:min(1100px,calc(100% - 24px));margin:auto;padding:16px 0 100px}.tools{position:sticky;top:0;z-index:5;padding:12px 0;background:rgba(12,12,13,.93);backdrop-filter:blur(12px)}
.search{width:100%;padding:14px 16px;border:1px solid var(--line);border-radius:14px;background:var(--panel);color:#fff;outline:none}.search:focus{border-color:var(--gold)}
.cats{display:flex;gap:8px;overflow:auto;padding:12px 0 2px;scrollbar-width:none}.cats::-webkit-scrollbar{display:none}
button{white-space:nowrap;border:1px solid var(--line);border-radius:999px;padding:9px 13px;background:var(--panel);color:var(--muted);cursor:pointer}
button.active,button:hover{background:var(--gold);border-color:var(--gold);color:#111}
section{margin-top:28px}.head{display:flex;justify-content:space-between;align-items:end;margin-bottom:12px}h2{margin:0}.count{color:var(--muted);font-size:.9rem}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}article{display:flex;justify-content:space-between;align-items:center;gap:14px;padding:16px;border:1px solid var(--line);border-radius:18px;background:linear-gradient(145deg,var(--panel),var(--panel2))}
.name{font-weight:800;margin:0 0 5px}.size{color:var(--muted);margin:0;font-size:.92rem}.price{color:var(--gold2);font-weight:900;font-size:1.18rem;white-space:nowrap}
.empty{display:none;text-align:center;color:var(--muted);padding:40px}.wa{position:fixed;right:18px;bottom:18px;padding:14px 18px;border-radius:999px;background:var(--green);color:#071b0d;font-weight:850;text-decoration:none;box-shadow:0 10px 30px #0008}
footer{text-align:center;color:var(--muted);padding:25px 16px 90px;border-top:1px solid var(--line)}.refresh{margin-top:12px;background:transparent;color:var(--gold2);border-color:#6d571e}
@media(max-width:560px){.grid{grid-template-columns:1fr}.wa span{display:none}.wa{width:56px;height:56px;display:grid;place-items:center;padding:0;font-size:1.35rem}}
</style>
</head>
<body>

  <div><button id="refresh" class="refresh">↻ Actualizar menú</button></div>

 {"Categoria": "Vinos y licores", "Producto": "Hornitos Plata", "Presentacion": "700 ml", "Precio": 320, "Activo": true}, {"Categoria": "Vinos y licores", "Producto": "Bacardí Carta Blanca", "Presentacion": "980 ml", "Precio": 275, "Activo": true}, {"Categoria": "Vinos y licores", "Producto": "Tradicional Reposado", "Presentacion": "950 ml", "Precio": 475, "Activo": true}, {"Categoria": "Vinos y licores", "Producto": "Tradicional Plata", "Presentacion": "950 ml", "Precio": 475, "Activo": true}, {"Categoria": "Vinos y licores", "Producto": "Tradicional Cristalino", "Presentacion": "750 ml", "Precio": 555, "Activo": true}, {"Categoria": "Vinos y licores", "Producto": "Tradicional Cristalino", "Presentacion": "1.75 L", "Precio": 1350, "Activo": true}, {"Categoria": "Vinos y licores", "Producto": "1800 Añejo", "Presentacion": "700 ml", "Precio": 780, "Activo": true}, {"Categoria": "Vinos y licores", "Producto": "1800 Blanco", "Presentacion": "700 ml", "Precio": 550, "Activo": true}, {"Categoria": "Vinos y licores", "Producto": "1800 Reposado", "Presentacion": "700 ml", "Precio": 630, "Activo": true}, {"Categoria": "Vinos y licores", "Producto": "1800 Cristalino", "Presentacion": "700 ml", "Precio": 845, "Activo": true}, {"Categoria": "Vinos y licores", "Producto": "Maestro Dobel Diamante", "Presentacion": "1.75 L", "Precio": 1875, "Activo": true}, {"Categoria": "Vinos y licores", "Producto": "Centenario Ultra", "Presentacion": "700 ml", "Precio": 535, "Activo": true}, {"Categoria": "Vinos y licores", "Producto": "Gran Malo Horchata", "Presentacion": "750 ml", "Precio": 420, "Activo": true}, {"Categoria": "Vinos y licores", "Producto": "Absolut", "Presentacion": "750 ml", "Precio": 260, "Activo": true}, {"Categoria": "Vinos y licores", "Producto": "Martell V.S.O.P.", "Presentacion": "700 ml", "Precio": 1050, "Activo": true}, {"Categoria": "Vinos y licores", "Producto": "Centenario Plata", "Presentacion": "950 ml", "Precio": 375, "Activo": true}, {"Categoria": "Vinos y licores", "Producto": "Centenario Reposado", "Presentacion": "950 ml", "Precio": 375, "Activo": true}, {"Categoria": "Vinos y licores", "Producto": "Maestro Dobel", "Presentacion": "700 ml", "Precio": 810, "Activo": true}];
let products = FALLBACK;
let config = {
  NombreNegocio:"Sánchez Drinks",
  Eslogan:"Cervezas, refrescos, vinos y licores",
  Telefono:"3541261257",
  MensajeWhatsApp:"Hola, quiero hacer un pedido en Sánchez Drinks",
  Moneda:"MXN",
  Aviso:"Existencias y precios sujetos a cambio."
};
let activeCategory = "Todos";

const normalize = s => String(s ?? "").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"");
const isActive = v => !["false","falso","no","0","inactivo"].includes(normalize(v)) && v !== false && v !== 0;
const money = v => new Intl.NumberFormat("es-MX",{style:"currency",currency:config.Moneda || "MXN",maximumFractionDigits:0}).format(Number(v)||0);

function csvUrl(sheetName){
  return `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:csv&sheet=${encodeURIComponent(sheetName)}&t=${Date.now()}`;
}

function parseCSV(text){
  const rows=[]; let row=[],cell="",quoted=false;
  for(let i=0;i<text.length;i++){
    const ch=text[i],next=text[i+1];
    if(ch==='"' && quoted && next==='"'){cell+='"';i++;}
    else if(ch==='"'){quoted=!quoted;}
    else if(ch===',' && !quoted){row.push(cell);cell="";}
    else if((ch==='\n'||ch==='\r') && !quoted){
      if(ch==='\r'&&next==='\n') i++;
      row.push(cell);cell="";
      if(row.some(v=>v!=="")) rows.push(row);
      row=[];
    } else cell+=ch;
  }
  if(cell!==""||row.length){row.push(cell);rows.push(row);}
  if(!rows.length) return [];
  const headers=rows[0].map(h=>h.trim());
  return rows.slice(1).map(r=>Object.fromEntries(headers.map((h,i)=>[h,(r[i]??"").trim()])));
}

function setStatus(text,type=""){
  document.getElementById("statusText").textContent=text;
  document.getElementById("statusDot").className="dot "+type;
}

function applyConfig(){
  document.getElementById("businessName").textContent="🥃 "+(config.NombreNegocio||"Sánchez Drinks");
  document.getElementById("tagline").textContent=config.Eslogan||"";
  document.getElementById("footer").textContent=config.Aviso||"";
  const phone=String(config.Telefono||"").replace(/\D/g,"");
  const fullPhone=phone.startsWith("52")?phone:"52"+phone;
  document.getElementById("wa").href=`https://wa.me/${fullPhone}?text=${encodeURIComponent(config.MensajeWhatsApp||"Hola")}`;
}

function renderCategories(){
  const cats=["Todos",...new Set(products.filter(p=>isActive(p.Activo)).map(p=>p.Categoria).filter(Boolean))];
  if(!cats.includes(activeCategory)) activeCategory="Todos";
  const box=document.getElementById("categories");
  box.innerHTML=cats.map(c=>`<button class="${c===activeCategory?"active":""}" data-cat="${c}">${c}</button>`).join("");
  box.querySelectorAll("button").forEach(b=>b.onclick=()=>{activeCategory=b.dataset.cat;renderCategories();render();});
}

function render(){
  const q=normalize(document.getElementById("search").value);
  const visible=products.filter(p=>isActive(p.Activo)&&(activeCategory==="Todos"||p.Categoria===activeCategory)&&normalize(`${p.Producto} ${p.Presentacion} ${p.Categoria}`).includes(q));
  const groups=[...new Set(visible.map(p=>p.Categoria))];
  document.getElementById("menu").innerHTML=groups.map(cat=>{
    const items=visible.filter(p=>p.Categoria===cat);
    return `<section><div class="head"><h2>${cat}</h2><span class="count">${items.length} producto${items.length===1?"":"s"}</span></div>
    <div class="grid">${items.map(p=>`<article><div><p class="name">${p.Producto}</p><p class="size">${p.Presentacion||""}</p></div><div class="price">${money(String(p.Precio).replace(/[$,]/g,""))}</div></article>`).join("")}</div></section>`;
  }).join("");
  document.getElementById("empty").style.display=visible.length?"none":"block";
}

async function loadGoogleSheet(){
  setStatus("Consultando Google Sheets…");
  try{
    const [prodResponse,confResponse]=await Promise.all([
      fetch(csvUrl("Productos"),{cache:"no-store"}),
      fetch(csvUrl("Configuracion"),{cache:"no-store"})
    ]);
    if(!prodResponse.ok) throw new Error("No se pudo abrir la hoja Productos");
    const prodText=await prodResponse.text();
    const loaded=parseCSV(prodText);
    if(!loaded.length || !("Producto" in loaded[0])) throw new Error("La hoja Productos no tiene los encabezados esperados");
    products=loaded;

    if(confResponse.ok){
      const conf=parseCSV(await confResponse.text());
      if(conf.length) config=Object.fromEntries(conf.map(r=>[r.Campo,r.Valor]));
    }
    applyConfig();renderCategories();render();
    setStatus("Menú actualizado desde Google Sheets","ok");
  }catch(error){
    products=FALLBACK;
    applyConfig();renderCategories();render();
    setStatus("Mostrando copia local; revisa que la hoja sea pública","error");
    console.error(error);
  }
}

document.getElementById("search").addEventListener("input",render);
document.getElementById("refresh").addEventListener("click",loadGoogleSheet);
applyConfig();renderCategories();render();loadGoogleSheet();
</script>
</body>
</html>
