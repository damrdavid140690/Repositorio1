<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0c0c0d">
<title>Sánchez Drinks | Menú digital</title>
<style>
:root{--bg:#071820;--panel:#102a34;--panel2:#163945;--text:#f7fbfc;--muted:#b7cbd1;--gold:#e0ad25;--gold2:#f3d77d;--line:#28505c;--green:#25d366;--red:#ff6b6b}
*{box-sizing:border-box}html{scroll-behavior:smooth}
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--text);min-height:100vh;background:radial-gradient(circle at 15% 10%,rgba(255,255,255,.12) 0 2px,transparent 3px),radial-gradient(circle at 85% 22%,rgba(255,255,255,.09) 0 3px,transparent 4px),linear-gradient(160deg,#06141b,#0a2631 48%,#071820);background-size:95px 95px,130px 130px,auto}
header{padding:34px 18px 25px;text-align:center;border-bottom:1px solid var(--line);background:linear-gradient(180deg,rgba(255,255,255,.05),transparent)}.logo{width:100px;height:100px;border-radius:50%;object-fit:contain;background:#fff;border:3px solid #fff;padding:5px;display:none;margin:0 auto 12px;box-shadow:0 12px 35px #0008}h1{margin:0;font-size:clamp(2rem,8vw,3.5rem)}.sub{color:var(--muted);margin:8px 0 0}
.status{display:inline-flex;align-items:center;gap:8px;margin-top:15px;padding:7px 11px;border:1px solid var(--line);border-radius:999px;color:var(--muted);font-size:.86rem;background:#ffffff08}
.dot{width:9px;height:9px;border-radius:50%;background:var(--gold)}.dot.ok{background:var(--green)}.dot.error{background:var(--red)}
.wrap{width:min(1100px,calc(100% - 24px));margin:auto;padding:16px 0 100px}.tools{position:sticky;top:0;z-index:5;padding:12px 0;background:rgba(12,12,13,.93);backdrop-filter:blur(12px)}
.search{width:100%;padding:14px 16px;border:1px solid var(--line);border-radius:14px;background:var(--panel);color:#fff;outline:none}.search:focus{border-color:var(--gold)}
.cats{display:flex;gap:8px;overflow:auto;padding:12px 0 2px;scrollbar-width:none}.cats::-webkit-scrollbar{display:none}
button{white-space:nowrap;border:1px solid var(--line);border-radius:999px;padding:9px 13px;background:var(--panel);color:var(--muted);cursor:pointer}
button.active,button:hover{background:var(--gold);border-color:var(--gold);color:#111}
section{margin-top:28px}.head{display:flex;justify-content:space-between;align-items:end;margin-bottom:12px}h2{margin:0}.count{color:var(--muted);font-size:.9rem}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:16px}article{overflow:hidden;border:1px solid var(--line);border-radius:20px;background:linear-gradient(145deg,var(--panel),var(--panel2));box-shadow:0 12px 28px #0004;transition:.2s}article:hover{transform:translateY(-3px);border-color:#4c7b88}.product-image{width:100%;height:190px;object-fit:cover;display:block;background:#0c2029}.image-placeholder{height:190px;display:grid;place-items:center;font-size:3.2rem;background:radial-gradient(circle at 50% 35%,#244d59,#0b222b 72%)}.product-body{padding:15px}.product-top{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}.name{font-weight:800;margin:0 0 5px}.size{color:var(--muted);margin:0;font-size:.92rem}.description{color:#d4e2e6;margin:10px 0 0;font-size:.9rem;line-height:1.4}.price{color:var(--gold2);font-weight:900;font-size:1.18rem;white-space:nowrap}.badge{display:inline-block;margin-top:10px;padding:5px 9px;border-radius:999px;background:#e0ad2526;color:var(--gold2);font-size:.78rem;font-weight:750}
.empty{display:none;text-align:center;color:var(--muted);padding:40px}.wa{position:fixed;right:18px;bottom:18px;padding:14px 18px;border-radius:999px;background:var(--green);color:#071b0d;font-weight:850;text-decoration:none;box-shadow:0 10px 30px #0008}
footer{text-align:center;color:var(--muted);padding:25px 16px 90px;border-top:1px solid var(--line)}.refresh{margin-top:12px;background:transparent;color:var(--gold2);border-color:#6d571e}
@media(max-width:560px){.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.product-image,.image-placeholder{height:145px}.product-body{padding:12px}.product-top{display:block}.price{display:block;margin-top:8px}.description{display:none}.wa span{display:none}.wa{width:56px;height:56px;display:grid;place-items:center;padding:0;font-size:1.35rem}}@media(max-width:360px){.grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<header>
  <img id="businessLogo" class="logo" alt="Logo de Sánchez Drinks">
  <h1 id="businessName">🥃 Sánchez Drinks</h1>
  <p id="tagline" class="sub">Cervezas, refrescos, vinos y licores</p>
  <div class="status"><span id="statusDot" class="dot"></span><span id="statusText">Consultando Google Sheets…</span></div>
  <div><button id="refresh" class="refresh">↻ Actualizar menú</button></div>
</header>
<main class="wrap">
  <div class="tools">
    <input id="search" class="search" type="search" placeholder="Buscar producto...">
    <div id="categories" class="cats"></div>
  </div>
  <div id="menu"></div>
  <div id="empty" class="empty">No se encontraron productos.</div>
</main>
<a id="wa" class="wa" href="#" target="_blank" rel="noopener">💬 <span>Pedir por WhatsApp</span></a>
<footer id="footer">Existencias y precios sujetos a cambio.</footer>

<script>
const SHEET_ID = "1kAApGdNhw-0i7SfM71Din0-ofpH-EDq4YGjQn4Sh500";
const FALLBACK = [{"Categoria": "Cervezas", "Producto": "Familiar", "Presentacion": "940 ml", "Precio": 48, "Activo": true}, {"Categoria": "Cervezas", "Producto": "Modelo Mega", "Presentacion": "1 L", "Precio": 50, "Activo": true}, {"Categoria": "Cervezas", "Producto": "Corona Cuartito", "Presentacion": "250 ml", "Precio": 15, "Activo": true}, {"Categoria": "Cervezas", "Producto": "Corona Mediana", "Presentacion": "355 ml", "Precio": 22, "Activo": true}, {"Categoria": "Cervezas", "Producto": "Corona Light Lata", "Presentacion": "355 ml", "Precio": 22, "Activo": true}, {"Categoria": "Cervezas", "Producto": "Modelo Lata", "Presentacion": "355 ml", "Precio": 25, "Activo": true}, {"Categoria": "Cervezas", "Producto": "Estrella Latón", "Presentacion": "473 ml", "Precio": 27, "Activo": true}, {"Categoria": "Cervezas", "Producto": "Victoria Latón", "Presentacion": "473 ml", "Precio": 28, "Activo": true}, {"Categoria": "Cervezas", "Producto": "Sol Clamato Latón", "Presentacion": "473 ml", "Precio": 25, "Activo": true}, {"Categoria": "Cervezas", "Producto": "Modelo Lata", "Presentacion": "710 ml", "Precio": 45, "Activo": true}, {"Categoria": "Cervezas", "Producto": "Ultra Michelob Botella", "Presentacion": "355 ml", "Precio": 25, "Activo": true}, {"Categoria": "Cervezas", "Producto": "Corona Cero", "Presentacion": "355 ml", "Precio": 22, "Activo": true}, {"Categoria": "Cervezas", "Producto": "New Mix", "Presentacion": "355 ml", "Precio": 28, "Activo": true}, {"Categoria": "Cervezas", "Producto": "New Mix Latón", "Presentacion": "473 ml", "Precio": 35, "Activo": true}, {"Categoria": "Cervezas", "Producto": "Caribe", "Presentacion": "300 ml", "Precio": 24, "Activo": true}, {"Categoria": "Cervezas", "Producto": "Barullo Lata", "Presentacion": "355 ml", "Precio": 36, "Activo": true}, {"Categoria": "Cervezas", "Producto": "Kool Lata", "Presentacion": "355 ml", "Precio": 25, "Activo": true}, {"Categoria": "Cervezas", "Producto": "Miller", "Presentacion": "940 ml", "Precio": 48, "Activo": true}, {"Categoria": "Cigarros", "Producto": "Marlboro", "Presentacion": "", "Precio": 110, "Activo": true}, {"Categoria": "Cigarros", "Producto": "Pall Mall", "Presentacion": "", "Precio": 110, "Activo": true}, {"Categoria": "Refrescos", "Producto": "Coca-Cola Lata", "Presentacion": "355 ml", "Precio": 27, "Activo": true}, {"Categoria": "Refrescos", "Producto": "Coca-Cola Sin Azúcar Lata", "Presentacion": "355 ml", "Precio": 27, "Activo": true}, {"Categoria": "Refrescos", "Producto": "Topo Chico", "Presentacion": "600 ml", "Precio": 25, "Activo": true}, {"Categoria": "Refrescos", "Producto": "Peñafiel Cristal", "Presentacion": "355 ml", "Precio": 25, "Activo": true}, {"Categoria": "Refrescos", "Producto": "Boost", "Presentacion": "235 ml", "Precio": 23, "Activo": true}, {"Categoria": "Refrescos", "Producto": "Electrolit", "Presentacion": "600 ml", "Precio": 27, "Activo": true}, {"Categoria": "Refrescos", "Producto": "Monster", "Presentacion": "473 ml", "Precio": 45, "Activo": true}, {"Categoria": "Refrescos", "Producto": "Volt", "Presentacion": "473 ml", "Precio": 25, "Activo": true}, {"Categoria": "Refrescos", "Producto": "Squirt", "Presentacion": "400 ml", "Precio": 18, "Activo": true}, {"Categoria": "Refrescos", "Producto": "Sidral", "Presentacion": "400 ml", "Precio": 18, "Activo": true}, {"Categoria": "Refrescos", "Producto": "Squirt", "Presentacion": "2 L", "Precio": 37, "Activo": true}, {"Categoria": "Refrescos", "Producto": "Peñafiel", "Presentacion": "2 L", "Precio": 33, "Activo": true}, {"Categoria": "Refrescos", "Producto": "Fanta Lata", "Presentacion": "355 ml", "Precio": 27, "Activo": true}, {"Categoria": "Refrescos", "Producto": "Sprite Lata", "Presentacion": "355 ml", "Precio": 27, "Activo": true}, {"Categoria": "Refrescos", "Producto": "Agua", "Presentacion": "600 ml", "Precio": 15, "Activo": true}, {"Categoria": "Refrescos", "Producto": "Agua", "Presentacion": "1 L", "Precio": 20, "Activo": true}, {"Categoria": "Refrescos", "Producto": "Power", "Presentacion": "600 ml", "Precio": 30, "Activo": true}, {"Categoria": "Refrescos", "Producto": "Gatorade", "Presentacion": "600 ml", "Precio": 30, "Activo": true}, {"Categoria": "Vinos y licores", "Producto": "Lambrusco", "Presentacion": "750 ml", "Precio": 165, "Activo": true}, {"Categoria": "Vinos y licores", "Producto": "Jack Daniel’s", "Presentacion": "700 ml", "Precio": 529, "Activo": true}, {"Categoria": "Vinos y licores", "Producto": "Malibú", "Presentacion": "750 ml", "Precio": 265, "Activo": true}, {"Categoria": "Vinos y licores", "Producto": "Rémy Martin V.S.O.P.", "Presentacion": "700 ml", "Precio": 1170, "Activo": true}, {"Categoria": "Vinos y licores", "Producto": "Buchanan’s Master", "Presentacion": "750 ml", "Precio": 1400, "Activo": true}, {"Categoria": "Vinos y licores", "Producto": "Old Parr 12 Años", "Presentacion": "750 ml", "Precio": 840, "Activo": true}, {"Categoria": "Vinos y licores", "Producto": "Don Julio Reposado", "Presentacion": "700 ml", "Precio": 790, "Activo": true}, {"Categoria": "Vinos y licores", "Producto": "Don Julio 70", "Presentacion": "700 ml", "Precio": 940, "Activo": true}, {"Categoria": "Vinos y licores", "Producto": "Don Julio Blanco", "Presentacion": "700 ml", "Precio": 710, "Activo": true}, {"Categoria": "Vinos y licores", "Producto": "Buchanan’s 18", "Presentacion": "750 ml", "Precio": 2270, "Activo": true}, {"Categoria": "Vinos y licores", "Producto": "Patrón Silver", "Presentacion": "750 ml", "Precio": 470, "Activo": true}, {"Categoria": "Vinos y licores", "Producto": "Patrón Cristalino", "Presentacion": "750 ml", "Precio": 680, "Activo": true}, {"Categoria": "Vinos y licores", "Producto": "Herradura Cristalino", "Presentacion": "750 ml", "Precio": 710, "Activo": true}, {"Categoria": "Vinos y licores", "Producto": "Herradura Plata", "Presentacion": "700 ml", "Precio": 580, "Activo": true}, {"Categoria": "Vinos y licores", "Producto": "Herradura Reposado", "Presentacion": "700 ml", "Precio": 710, "Activo": true}, {"Categoria": "Vinos y licores", "Producto": "Hornitos Plata", "Presentacion": "700 ml", "Precio": 320, "Activo": true}, {"Categoria": "Vinos y licores", "Producto": "Bacardí Carta Blanca", "Presentacion": "980 ml", "Precio": 275, "Activo": true}, {"Categoria": "Vinos y licores", "Producto": "Tradicional Reposado", "Presentacion": "950 ml", "Precio": 475, "Activo": true}, {"Categoria": "Vinos y licores", "Producto": "Tradicional Plata", "Presentacion": "950 ml", "Precio": 475, "Activo": true}, {"Categoria": "Vinos y licores", "Producto": "Tradicional Cristalino", "Presentacion": "750 ml", "Precio": 555, "Activo": true}, {"Categoria": "Vinos y licores", "Producto": "Tradicional Cristalino", "Presentacion": "1.75 L", "Precio": 1350, "Activo": true}, {"Categoria": "Vinos y licores", "Producto": "1800 Añejo", "Presentacion": "700 ml", "Precio": 780, "Activo": true}, {"Categoria": "Vinos y licores", "Producto": "1800 Blanco", "Presentacion": "700 ml", "Precio": 550, "Activo": true}, {"Categoria": "Vinos y licores", "Producto": "1800 Reposado", "Presentacion": "700 ml", "Precio": 630, "Activo": true}, {"Categoria": "Vinos y licores", "Producto": "1800 Cristalino", "Presentacion": "700 ml", "Precio": 845, "Activo": true}, {"Categoria": "Vinos y licores", "Producto": "Maestro Dobel Diamante", "Presentacion": "1.75 L", "Precio": 1875, "Activo": true}, {"Categoria": "Vinos y licores", "Producto": "Centenario Ultra", "Presentacion": "700 ml", "Precio": 535, "Activo": true}, {"Categoria": "Vinos y licores", "Producto": "Gran Malo Horchata", "Presentacion": "750 ml", "Precio": 420, "Activo": true}, {"Categoria": "Vinos y licores", "Producto": "Absolut", "Presentacion": "750 ml", "Precio": 260, "Activo": true}, {"Categoria": "Vinos y licores", "Producto": "Martell V.S.O.P.", "Presentacion": "700 ml", "Precio": 1050, "Activo": true}, {"Categoria": "Vinos y licores", "Producto": "Centenario Plata", "Presentacion": "950 ml", "Precio": 375, "Activo": true}, {"Categoria": "Vinos y licores", "Producto": "Centenario Reposado", "Presentacion": "950 ml", "Precio": 375, "Activo": true}, {"Categoria": "Vinos y licores", "Producto": "Maestro Dobel", "Presentacion": "700 ml", "Precio": 810, "Activo": true}];
let products = FALLBACK;
let config = {
  NombreNegocio:"Sánchez Drinks",
  Eslogan:"Cervezas, refrescos, vinos y licores",
  Telefono:"3541261257",
  MensajeWhatsApp:"Hola, quiero hacer un pedido en Sánchez Drinks",
  Moneda:"MXN",
  Aviso:"Existencias y precios sujetos a cambio.",
  Logo:""
};
let activeCategory = "Todos";
const priorityCategories = ["Bebidas Preparadas","Alimentos"];

const normalize = s => String(s ?? "").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"");
const isActive = v => !["false","falso","no","0","inactivo"].includes(normalize(v)) && v !== false && v !== 0;
const money = v => new Intl.NumberFormat("es-MX",{style:"currency",currency:config.Moneda || "MXN",maximumFractionDigits:0}).format(Number(v)||0);
const esc = s => String(s ?? "").replace(/[&<>"\']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","\'":"&#039;"}[c]));

function csvUrl(){
  return `https://docs.google.com/spreadsheets/d/${SHEET_ID}/export?format=csv&gid=0&t=${Date.now()}`;
}

function parseCSV(text){
  const rows=[]; let row=[],cell="",quoted=false;
  for(let i=0;i<text.length;i++){
    const ch=text[i],next=text[i+1];
    if(ch==='"' && quoted && next==='"'){cell+='"';i++;}
    else if(ch==='"'){quoted=!quoted;}
    else if(ch===',' && !quoted){row.push(cell);cell="";}
    else if((ch==='\n'||ch==='\r') && !quoted){
      if(ch==='\r'&&next==='\n') i++;
      row.push(cell);cell="";
      if(row.some(v=>v!=="")) rows.push(row);
      row=[];
    } else cell+=ch;
  }
  if(cell!==""||row.length){row.push(cell);rows.push(row);}
  if(!rows.length) return [];
  const headers=rows[0].map(h=>h.trim());
  return rows.slice(1).map(r=>Object.fromEntries(headers.map((h,i)=>[h,(r[i]??"").trim()])));
}

function setStatus(text,type=""){
  document.getElementById("statusText").textContent=text;
  document.getElementById("statusDot").className="dot "+type;
}

function applyConfig(){
  document.getElementById("businessName").textContent="🥃 "+(config.NombreNegocio||"Sánchez Drinks");
  document.getElementById("tagline").textContent=config.Eslogan||"";
  document.getElementById("footer").textContent=config.Aviso||"";

  const logo=document.getElementById("businessLogo");
  if(config.Logo){
    logo.src=config.Logo;
    logo.style.display="block";
    logo.onerror=()=>logo.style.display="none";
  }else{
    logo.style.display="none";
  }

  const phone=String(config.Telefono||"").replace(/\D/g,"");
  const fullPhone=phone.startsWith("52")?phone:"52"+phone;
  document.getElementById("wa").href=`https://wa.me/${fullPhone}?text=${encodeURIComponent(config.MensajeWhatsApp||"Hola")}`;
}

function orderedCategories(){
  const cats=[...new Set(products.filter(p=>isActive(p.Activo)).map(p=>p.Categoria).filter(Boolean))];
  return cats.sort((a,b)=>{
    const ia=priorityCategories.indexOf(a), ib=priorityCategories.indexOf(b);
    if(ia!==-1 || ib!==-1){
      if(ia===-1) return 1;
      if(ib===-1) return -1;
      return ia-ib;
    }
    return a.localeCompare(b,"es");
  });
}

function renderCategories(){
  const cats=["Todos",...orderedCategories()];
  if(!cats.includes(activeCategory)) activeCategory="Todos";
  const box=document.getElementById("categories");
  box.innerHTML=cats.map(c=>`<button class="${c===activeCategory?"active":""}" data-cat="${esc(c)}">${esc(c)}</button>`).join("");
  box.querySelectorAll("button").forEach(b=>b.onclick=()=>{activeCategory=b.dataset.cat;renderCategories();render();});
}

function productImage(p){
  const url=(p.Imagen||p.Foto||p.URLImagen||"").trim();
  if(!url) return `<div class="image-placeholder">🥤</div>`;
  return `<img class="product-image" src="${esc(url)}" alt="${esc(p.Producto)}" loading="lazy" onerror="this.outerHTML='<div class=&quot;image-placeholder&quot;>🥤</div>'">`;
}

function render(){
  const q=normalize(document.getElementById("search").value);
  const visible=products.filter(p=>
    isActive(p.Activo) &&
    (activeCategory==="Todos"||p.Categoria===activeCategory) &&
    normalize(`${p.Producto} ${p.Presentacion} ${p.Categoria} ${p.Descripcion||""}`).includes(q)
  );

  const groups=orderedCategories().filter(cat=>visible.some(p=>p.Categoria===cat));

  document.getElementById("menu").innerHTML=groups.map(cat=>{
    const items=visible.filter(p=>p.Categoria===cat);
    return `<section>
      <div class="head"><h2>${esc(cat)}</h2><span class="count">${items.length} producto${items.length===1?"":"s"}</span></div>
      <div class="grid">${items.map(p=>`
        <article>
          ${productImage(p)}
          <div class="product-body">
            <div class="product-top">
              <div>
                <p class="name">${esc(p.Producto)}</p>
                <p class="size">${esc(p.Presentacion||"")}</p>
              </div>
              <div class="price">${money(String(p.Precio).replace(/[$,]/g,""))}</div>
            </div>
            ${p.Descripcion?`<p class="description">${esc(p.Descripcion)}</p>`:""}
            ${isActive(p.Destacado)&&String(p.Destacado).trim()!==""?`<span class="badge">⭐ Destacado</span>`:""}
          </div>
        </article>`).join("")}
      </div>
    </section>`;
  }).join("");

  document.getElementById("empty").style.display=visible.length?"none":"block";
}

async function loadGoogleSheet(){
  setStatus("Consultando Google Sheets…");
  const controller = new AbortController();
  const timeout = setTimeout(() => controller.abort(), 12000);

  try{
    const response = await fetch(csvUrl(), {
      cache: "no-store",
      signal: controller.signal
    });

    if(!response.ok){
      throw new Error(`Error HTTP ${response.status}`);
    }

    const text = await response.text();
    const loaded = parseCSV(text);

    if(!loaded.length || !("Producto" in loaded[0])){
      throw new Error("La hoja no tiene los encabezados esperados");
    }

    products = loaded;
    applyConfig();
    renderCategories();
    render();
    setStatus("Menú actualizado desde Google Sheets", "ok");
  }catch(error){
    products = FALLBACK;
    applyConfig();
    renderCategories();
    render();

    const mensaje = error.name === "AbortError"
      ? "Google Sheets tardó demasiado; mostrando copia local"
      : "Mostrando copia local; revisa la publicación de la hoja";

    setStatus(mensaje, "error");
    console.error("Error al cargar Google Sheets:", error);
  }finally{
    clearTimeout(timeout);
  }
}

window.addEventListener("error", event => {
  setStatus("Error de JavaScript: " + event.message, "error");
  console.error(event.error || event.message);
});

document.getElementById("search").addEventListener("input",render);
document.getElementById("refresh").addEventListener("click",loadGoogleSheet);
applyConfig();renderCategories();render();loadGoogleSheet();
</script>
</body>
</html>
